<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favicon at real sizes</title>
<!-- Design reference exported from the design canvas. Static markup with inline styles; not production code. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400&amp;family=Space+Grotesk:wght@600&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 720px; height: 360px; box-sizing: border-box; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #121417; padding: 32px; display: flex; flex-direction: column; gap: 28px">

<!-- size row -->
<div style="display: flex; align-items: flex-end; gap: 36px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="width: 180px; height: 180px; background: #121417; border-radius: 40px; position: relative; display: flex; align-items: center; justify-content: center"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 126px; line-height: 1; letter-spacing: -0.04em; color: #F6F6F3; transform: translate(-16px, -2px)">ž</span><span style="position: absolute; right: 41px; bottom: 48px; width: 25px; height: 25px; border-radius: 50%; background: #34D399"></span></div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5B6068">180 · apple-touch</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="width: 48px; height: 48px; background: #121417; border-radius: 11px; position: relative; display: flex; align-items: center; justify-content: center"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 34px; line-height: 1; letter-spacing: -0.04em; color: #F6F6F3; transform: translate(-4px, -1px)">ž</span><span style="position: absolute; right: 11px; bottom: 13px; width: 7px; height: 7px; border-radius: 50%; background: #34D399"></span></div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5B6068">48</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="width: 32px; height: 32px; background: #121417; border-radius: 7px; position: relative; display: flex; align-items: center; justify-content: center"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 23px; line-height: 1; letter-spacing: -0.04em; color: #F6F6F3; transform: translate(-3px, 0)">ž</span><span style="position: absolute; right: 7px; bottom: 9px; width: 5px; height: 5px; border-radius: 50%; background: #34D399"></span></div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5B6068">32</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="width: 16px; height: 16px; background: #121417; border-radius: 4px; position: relative; display: flex; align-items: center; justify-content: center"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12px; line-height: 1; color: #F6F6F3">ž</span></div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #5B6068">16 · no dot</span>
</div>
</div>

<!-- tab previews -->
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; background: #E7E8E4; border-radius: 10px; padding: 6px">
<div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 7px; padding: 8px 14px; font-size: 13px; width: 280px">
<div style="flex: 0 0 16px; width: 16px; height: 16px; background: #121417; border-radius: 4px; display: flex; align-items: center; justify-content: center"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12px; line-height: 1; color: #F6F6F3">ž</span></div>
<span>Žan V. Dragan - Software Engineer</span>
</div>
</div>
<div style="display: flex; align-items: center; background: #202124; border-radius: 10px; padding: 6px">
<div style="display: flex; align-items: center; gap: 8px; background: #35363A; color: #E9EAE6; border-radius: 7px; padding: 8px 14px; font-size: 13px; width: 280px">
<div style="flex: 0 0 16px; width: 16px; height: 16px; background: #121417; border-radius: 4px; box-shadow: 0 0 0 1px #4A4D52; display: flex; align-items: center; justify-content: center"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12px; line-height: 1; color: #F6F6F3">ž</span></div>
<span>Žan V. Dragan - Software Engineer</span>
</div>
</div>
</div>
</div>
</body>
</html>
